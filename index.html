function takeoff(){const st=state(),rows=[],rates=st.rates;for(const e of st.elements.filter(a=>a.kind==='wall'||a.kind==='slab')){const openings=st.elements.filter(a=>a.host===e.id);let area=0,volume=0,net=0;try{const solids=solidsWithVoids(e);if(e.kind==='slab'){area=solids.reduce((a,c)=>a+c.w*c.d,0);volume=area*e.thick;net=area;}else{area=solids.reduce((a,c)=>a+c.w*c.h,0);volume=area*e.thick;net=area;}}catch(err){continue;}const rate=e.kind==='slab'?rates.concrete:rates.partition,unit=e.kind==='slab'?'m³':'m²',qty=e.kind==='slab'?volume:area;rows.push({id:e.id,category:e.kind,host:e.room,level:e.level,unit,qty,rate,total:qty*rate,source:'geometric solid less hosted openings',status:'REVIEW REQUIRED'});}
for(const e of st.mep){const qty=e.type==='equipment'?1:e.length,unit=e.type==='equipment'?'ea':'m',rate=rates[e.type]??0;rows.push({id:e.id,category:e.type,host:e.room,level:e.level,unit,qty,rate,total:qty*rate,source:'hosted model member',status:'REVIEW REQUIRED'});}return rows;}
function audit(){const st=state(),results=[],push=(status,name,reason)=>results.push({status,name,reason});const ids=new Set,hosts=new Map(st.elements.map(e=>[e.id,e]));for(const e of [...st.elements,...st.mep]){if(ids.has(e.id))push('FAIL','Duplicate ID '+e.id,'Component identifiers must be unique');ids.add(e.id);if(!byId(e.room))push('FAIL',e.id+' missing room host',String(e.room));if(!Number.isInteger(e.level)||e.level<0||e.level>20)push('FAIL',e.id+' invalid level','Level out of range');}
for(const e of st.elements){if(e.kind==='slab'&&(!validRect(e)||!ok(e.thick,.05,1.5)))push('FAIL',e.id+' invalid slab','Positive dimensions and thickness required');if(e.kind==='wall'&&(!ok(e.length,.1)||!ok(e.height,.2)||!ok(e.thick,.05,1.5)))push('FAIL',e.id+' invalid wall','Positive dimensions required');if(e.kind==='void'||e.kind==='opening'){const h=hosts.get(e.host);if(!h||h.kind!==(e.kind==='void'?'slab':'wall'))push('FAIL',e.id+' orphan opening','Missing parent solid');else if(e.kind==='void'&&(!validRect(e)||e.x<h.x||e.y<h.y||e.x+e.w>h.x+h.w+1e-6||e.y+e.h>h.y+h.h+1e-6))push('FAIL',e.id+' out of slab','Opening out of host bounds');else if(e.kind==='opening'&&(!ok(e.station)||!ok(e.sill)||!ok(e.w,.05)||!ok(e.h,.05)||e.station+e.w>h.length+1e-6||e.sill+e.h>h.height+1e-6))push('FAIL',e.id+' out of wall','Opening out of host bounds');}}
for(const m of st.mep){const r=byId(m.room);if(!ok(m.length,.1)||!ok(m.size,.025)||!ok(m.z)||!Number.isFinite(m.x)||!Number.isFinite(m.y))push('FAIL',m.id+' invalid MEP geometry','Dimensions/coordinates invalid');if(r&&(m.x<r.x-.01||m.x+m.length>r.x+r.w+.01||m.y<r.y-.01||m.y+m.size>r.y+r.h+.01||m.z+m.size>r.l*LH+r.ht+.01))push('WARN',m.id+' outside host room','Check offsets, size and containment');}
for(const [k,rate] of Object.entries(st.rates))if(!ok(rate,0,1e9))push('FAIL','Invalid unit rate '+k,'Must be finite and nonnegative');if(!results.length)push('PASS','Geometric data integrity','No invalid references or dimensions detected by the implemented checks');push('NOT TESTED','Structural engineering','Loads, reinforcement, assemblies and structural adequacy not verified');push('NOT TESTED','MEP coordination','Duct and pipe clashes, loads, connectivity and sizing not certified');push('NOT TESTED','Certified quantities','Takeoffs require calibrated specifications, scope rules and independent professional verification');return results;}
function exportSchedules(){const cs=x=>'"'+String(x??'').replaceAll('"','""')+'"';const rows=[['ID','Category','Room ID','Level','Unit','Net quantity','Unit rate CAD','Cost CAD','Basis','Review status'],...takeoff().map(r=>[r.id,r.category,r.host,r.level,r.unit,r.qty.toFixed(4),r.rate,r.total.toFixed(2),r.source,r.status])];downloadText(rows.map(r=>r.map(cs).join(',')).join('\r\n'),safeName()+'-bim-quantities.csv','text/csv');}
function exportAudit(){downloadText(JSON.stringify({format:'sequence-bim-technical-audit',schema:1,project:S.project,createdAt:new Date().toISOString(),elements:state().elements,mep:state().mep,rates:state().rates,quantitySchedule:takeoff(),audit:audit(),certified:false},null,2),safeName()+'-bim-qa.json','application/json');}
function field(id,label,value,step='.1'){return `<div><label for="${id}">${label}</label><input id="${id}" type="number" step="${step}" value="${E(value)}"></div>`;}

(()=>{
'use strict';
const header=document.querySelector('body>header'),oldBrand=header?.querySelector('.brand'),lib=document.getElementById('lib'),right=document.getElementById('rp'),ctr=document.getElementById('ctr');
if(!header||!oldBrand||!lib||!right||!ctr)return;
const headButtons=[...header.querySelectorAll(':scope>button')];
oldBrand.querySelector('small').textContent='SPATIAL INTELLIGENCE · VERTASCAN';
const ver=oldBrand.querySelector('b');if(ver)ver.textContent='SPACE LAB';
const top=document.createElement('nav');top.id='si-top';top.setAttribute('aria-label','SEQUENCE workflows');oldBrand.after(top);
const bar=document.createElement('div');bar.id='si-appbar';header.after(bar);
const leftNav=document.createElement('span');leftNav.className='si-caption';leftNav.id='si-current';leftNav.textContent='Plan & Program';bar.append(leftNav);
const actions=document.createElement('div');actions.id='si-actions';bar.append(actions);
const hint=document.createElement('span');hint.className='si-pill';hint.textContent='MODEL / DATA / COST / QA';bar.append(hint);
function btn(text,handler,title){const b=document.createElement('button');b.type='button';b.textContent=text;b.title=title||text;b.addEventListener('click',handler);return b}
function clickNode(id){const b=document.getElementById(id);if(b&&typeof b.click==='function')b.click();else console.warn('SEQUENCE command unavailable:',id)}
const original={};for(const b of headButtons){const label=b.textContent.trim().toLowerCase();if(!original[label])original[label]=b;}
function clickLabel(label){const b=original[label.toLowerCase()];if(b)b.click();else console.warn('Missing original command',label)}
const slot=document.createElement('span');slot.id='si-space';top.append(slot);
function menu(label,entries){const outer=document.createElement('div');outer.className='si-dropdown';const trigger=btn(label+' ▾',()=>{document.querySelectorAll('.si-dropdown').forEach(el=>{if(el!==outer)el.classList.remove('si-open')});outer.classList.toggle('si-open')});trigger.setAttribute('aria-haspopup','menu');const body=document.createElement('div');body.className='si-menu';body.setAttribute('role','menu');entries.forEach(e=>{if(e===null){const s=document.createElement('div');s.className='si-sep';body.append(s);return}let el;if(typeof e==='string'){el=original[e.toLowerCase()];if(!el)return;el.removeAttribute('style')}else el=btn(e[0],e[1]);el.addEventListener('click',()=>outer.classList.remove('si-open'));body.append(el)});outer.append(trigger,body);top.append(outer);return outer}
const workflowButtons=[];
function workflow(name,description,items,action){const b=btn(name,()=>{workflowButtons.forEach(x=>x.classList.remove('si-active'));b.classList.add('si-active');leftNav.textContent=description;actions.replaceChildren();for(const item of items){const a=btn(item[0],item[1]);actions.append(a)}if(typeof action==='function')action();try{localStorage.setItem('sequence-si-workflow',name)}catch(_){}});workflowButtons.push(b);top.insertBefore(b,slot);return b}
const callTab=(id)=>{S.rtab=id;if(typeof panels==='function')panels();};
const showLab=()=>clickNode('sl-entry');const showBIM=()=>clickNode('sbim-entry');
workflow('Plan','Plan & Program', [['Add living',()=>add('living')],['Add office',()=>add('office')],['Add corridor',()=>add('corridor')],['Auto doors',()=>clickLabel('Auto doors')],['Fit',()=>clickLabel('Fit')]],()=>{if(typeof setTool==='function')setTool('select');});

workflow('Technical','Hosted Systems',[['Solid + Voids',()=>SequenceBIM.show('elements')],['MEP',()=>SequenceBIM.show('mep')],['Takeoff',()=>SequenceBIM.show('cost')],['QA',()=>SequenceBIM.show('qa')]],()=>{showBIM()});
workflow('Cost','Estimate & Quantities',[['Live Space Cost',()=>{showLab();SequenceLab.tab('cost')}],['Technical Takeoff',()=>SequenceBIM.show('cost')],['Export Schedule',()=>SequenceBIM.exportSchedules()]],()=>{showLab();SequenceLab.tab('cost')});

// Any original command not assigned to a menu is still reachable here.

const settingsPanel=document.createElement('div');settingsPanel.id='si-settings';settingsPanel.innerHTML='<b>Workspace layout</b><label>Module library width</label><input type="range" id="si-left-width" min="145" max="280" value="180"><label>Inspector width</label><input type="range" id="si-right-width" min="260" max="470" value="310"><label><input type="checkbox" id="si-dense" style="width:auto"> Compact density</label><div class="si-row"><button id="si-toggle-left">Toggle modules</button><button id="si-toggle-right">Toggle inspector</button></div><div class="si-row" style="margin-top:8px"><button id="si-reset">Reset workspace</button><button id="si-close">Close</button></div>';
header.after(settingsPanel);

function setRight(show){document.body.classList.toggle('si-right-hidden',!show);resize()}

for(const id of ['si-left-width','si-right-width','si-dense'])settingsPanel.querySelector('#'+id).addEventListener('input',sizeApply);
settingsPanel.querySelector('#si-reset').onclick=()=>{settingsPanel.querySelector('#si-left-width').value=180;settingsPanel.querySelector('#si-right-width').value=310;settingsPanel.querySelector('#si-dense').checked=false;setLeft(true);setRight(true);sizeApply()};
try{const x=JSON.parse(localStorage.getItem('sequence-si-layout')||'{}');if(x.l)settingsPanel.querySelector('#si-left-width').value=x.l;if(x.r)settingsPanel.querySelector('#si-right-width').value=x.r;settingsPanel.querySelector('#si-dense').checked=!!x.compact}catch(_){}sizeApply();
// On narrow viewports prioritize the canvas and avoid side panels overlapping it.
const mobile=matchMedia('(max-width:760px)');function adapt(){if(mobile.matches){setLeft(false);setRight(false)}}adapt();
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.si-dropdown'))document.querySelectorAll('.si-dropdown').forEach(x=>x.classList.remove('si-open'))});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){document.querySelectorAll('.si-dropdown').forEach(x=>x.classList.remove('si-open'));settingsPanel.classList.remove('si-open')}});

// Shared route for discipline buttons: switch panels and always expose inspector.
window.SequenceDisciplines={
 open(name){
  const id=String(name||'').toLowerCase();
  document.body.classList.remove('si-right-hidden');
  if(id==='architecture'){S.rtab='p';panels();}
  else if(id==='structure'){window.SequenceBIM?.show('elements');}
  else if(id==='mep'){window.SequenceBIM?.show('mep');}
  else if(id==='interior'){S.rtab='p';panels();document.body.classList.remove('si-left-hidden');}
  else if(id==='cost'){window.SequenceBIM?.show('cost');}
  else if(id==='qa'){window.SequenceBIM?.show('qa');}
  else if(id==='space'){document.getElementById('sl-entry')?.click();window.SequenceLab?.tab('form');document.body.classList.remove('si-right-hidden');}
  else return;
  document.querySelectorAll('#si-disciplines button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.discipline===id)));
  document.getElementById('si-discipline-status').textContent=id==='mep'?'MEP · Select a room, then choose duct / pipe / equipment':id==='structure'?'STRUCTURE · Slabs, partitions and editable openings':id==='interior'?'INTERIOR · Select and edit spatial modules':id==='architecture'?'ARCHITECTURE · Edit room geometry and parameters':id==='space'?'SPACE LAB · Program and auto form generation':id==='cost'?'COST · Technical takeoff and unit rates':'QA · Integrity diagnostics';
  requestAnimationFrame(resize);
 }
};
const disciplineBar=document.createElement('nav');disciplineBar.id='si-disciplines';disciplineBar.setAttribute('aria-label','Design disciplines');
for(const [id,label] of [['architecture','Architecture'],['structure','Structure'],['mep','MEP'],['interior','Interior'],['space','Space Lab'],['cost','Cost'],['qa','QA']]){
 const button=btn(label,()=>window.SequenceDisciplines.open(id));button.dataset.discipline=id;button.setAttribute('aria-pressed','false');disciplineBar.append(button);
}
const ds=document.createElement('span');ds.id='si-discipline-status';ds.textContent='ARCHITECTURE · Select a design discipline';disciplineBar.append(ds);
bar.after(disciplineBar);
const current=localStorage.getItem('sequence-si-workflow')||'Plan';const wb=workflowButtons.find(x=>x.textContent===current)||workflowButtons[0];wb.click();
})();

(()=>{'use strict';
const ctr=document.getElementById('ctr'),top=document.getElementById('si-top'),bar=document.getElementById('si-actions');if(!ctr||!top||!bar)return;
const escapeHTML=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

<div><p class="vs-title">Drawing aids</p><div class="vs-line"><label for="vs-grid">Reference grid</label><input id="vs-grid" type="checkbox" checked></div><div class="vs-line"><label for="vs-contrast">High contrast linework</label><input id="vs-contrast" type="checkbox"></div><div class="vs-line"><label for="vs-ambient">Studio vignette</label><input id="vs-ambient" type="checkbox"></div></div><hr>

<script id="sequence-viewport-visibility-controller">
(()=>{'use strict';

center.appendChild(hud);
const hint=by('sequence-model-hint');

function fit(){
 try{
  const rr=rooms();if(!rr.length){if(typeof sample==='function')sample();else{update();return}}
  if(!rooms().some(r=>r.l===visibleLevel())){const first=rooms()[0];if(first){S.level=first.l; if(typeof refresh==='function')refresh()}}
  if(typeof draw==='function')draw();
  if(typeof fitPlan==='function')fitPlan();

 }catch(e){hint.textContent='Viewport recovery: '+(e.message||e)}
}

function onResize(){if(raf)return;raf=requestAnimationFrame(()=>{raf=0;const w=center.clientWidth,h=center.clientHeight;if(w<30||h<30)return;if(w===lastW&&h===lastH)return;lastW=w;lastH=h;if(typeof resize3==='function'&&v3&&getComputedStyle(v3).display!=='none')try{resize3()}catch(_){};if(typeof draw==='function'&&getComputedStyle(plan).display!=='none')try{draw()}catch(_){}})}
if(typeof ResizeObserver!=='undefined')new ResizeObserver(onResize).observe(center);

requestAnimationFrame(()=>requestAnimationFrame(()=>{fit();onResize()}));
setTimeout(()=>{update();if(center.clientHeight<50)hint.textContent='Viewport is too short · collapse a side panel';},600);
window.SequenceFitModel=fit;
})();
